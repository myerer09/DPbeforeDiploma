<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кабінет | MPP</title>
    <style>
        :root { --bg: #011F28; --form: #324E59; --text: #E3DBD2; --sub: #7F888D; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--text); padding: 40px 20px; margin: 0;}
        .wrapper { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--form); padding-bottom: 20px; }
        .section { display: none; margin-top: 30px; }
        .card { background: var(--form); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        label { display: block; margin-bottom: 5px; color: var(--sub); font-size: 0.85em; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: none; background: #E3DBD2; box-sizing: border-box; }
        
        .btn { background: #000; color: #fff; padding: 15px 25px; border: 1px solid var(--sub); border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--text); color: #000; }
        
        .item-list { margin-top: 20px; }
        .item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px; align-items: center;}
        .prod-image-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 15px; background: #000; }

        /* ДИЗАЙН ФОРМИ ДОДАВАННЯ */
        .add-product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        
        .image-upload-box {
            border: 2px dashed var(--sub);
            border-radius: 12px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            background: rgba(0,0,0,0.1);
            color: var(--sub);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }
        
        .image-upload-box:hover { border-color: var(--text); color: var(--text); }
        .image-upload-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }
        .full-width-btn { grid-column: 1 / -1; width: 100%; }

        @media (max-width: 600px) {
            .add-product-grid { grid-template-columns: 1fr; }
            .image-upload-box { height: 150px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1 id="userTitle" style="margin: 0;">Завантаження...</h1>
            <a href="/" style="color:var(--text); text-decoration:none; display: flex; align-items: center;">← На головну</a>
        </div>

        <div id="buyerSection" class="section">
            <div class="card">
                <h2>🛒 Мій Кошик</h2>
                <div id="cartItems" class="item-list"></div>
                <h3 id="totalPrice" style="text-align:right;">Разом: 0 грн</h3>
                <button class="btn" style="float:right;" onclick="checkout()">Оплатити замовлення</button>
                <div style="clear:both;"></div>
            </div>
        </div>

        <div id="masterSection" class="section">
            <div class="card">
                <h2>📦 Додати товар на вітрину</h2>
                
                <form id="addProdForm" class="add-product-grid">
                    <div class="left-col">
                        <label>Назва товару</label>
                        <input type="text" id="pName" required>
                        
                        <label>Категорія</label>
                        <select id="pCat">
                            <option value="Одяг">Одяг</option>
                            <option value="Посуд">Посуд</option>
                            <option value="Аксесуари">Аксесуари</option>
                            <option value="Декор">Декор</option>
                        </select>
                        
                        <label>Ціна (грн)</label>
                        <input type="number" id="pPrice" required min="1">
                    </div>

                    <div class="right-col">
                        <label>Фото виробу</label>
                        <div class="image-upload-box" id="dropArea">
                            <span id="dropText">Натисніть сюди,<br>щоб додати фото</span>
                            <img id="previewUpload" src="">
                            <input type="file" id="pImage" accept="image/*" style="display:none;">
                        </div>
                    </div>

                    <button type="submit" class="btn full-width-btn">Опублікувати</button>
                </form>

            </div>
            
            <div class="card" style="margin-top: 30px;">
                <h2>🛠️ Мої товари</h2>
                <div id="masterItems" class="item-list">Завантаження товарів...</div>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = '/';

        document.getElementById('userTitle').innerText = `${user.username} (${user.role === 'seller' ? 'Майстер' : 'Покупець'})`;

        if (user.role === 'seller') {
            document.getElementById('masterSection').style.display = 'block';
            loadMasterProducts();
        } else {
            document.getElementById('buyerSection').style.display = 'block';
            loadCart();
        }

        // Завантаження фото
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('pImage');
        const previewImg = document.getElementById('previewUpload');
        const dropText = document.getElementById('dropText');

        dropArea.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    previewImg.src = evt.target.result;
                    previewImg.style.display = 'block';
                    dropText.style.display = 'none';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // ЛОГІКА МАЙСТРА
        document.getElementById('addProdForm').onsubmit = async (e) => {
            e.preventDefault();
            let base64Image = null;
            if (fileInput.files.length > 0) {
                base64Image = await fileToBase64(fileInput.files[0]);
            }

            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('pName').value,
                    category: document.getElementById('pCat').value,
                    price: document.getElementById('pPrice').value,
                    seller_id: user.id,
                    image_url: base64Image
                })
            });
            if (res.ok) { 
                document.getElementById('addProdForm').reset();
                previewImg.style.display = 'none';
                previewImg.src = '';
                dropText.style.display = 'block';
                loadMasterProducts(); 
            }
        };

        async function loadMasterProducts() {
            const res = await fetch('/api/products');
            const prods = await res.json();
            const myProds = prods.filter(p => p.seller_id === user.id);
            
            document.getElementById('masterItems').innerHTML = myProds.map(p => `
                <div class="item">
                    <div style="display:flex; align-items:center;">
                        <img src="${p.image_url || ''}" class="prod-image-preview" style="display: ${p.image_url ? 'block' : 'none'}">
                        <span>${p.name} (${p.category})</span>
                    </div>
                    <b>${p.price} грн 
                        <button onclick="editProduct(${p.id}, '${p.name}', '${p.category}', ${p.price})" class="btn" style="padding:5px 10px; font-size:0.7em; margin-left: 10px;">✏️</button>
                        <button onclick="deleteProduct(${p.id})" class="btn" style="padding:5px 10px; font-size:0.7em; background: #ff6b6b; border:none;">🗑️</button>
                    </b>
                </div>
            `).join('');
        }

        async function deleteProduct(id) {
            if (!confirm("Дійсно видалити цей товар?")) return;
            const res = await fetch(`/api/products/${id}`, { 
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seller_id: user.id })
            });
            const data = await res.json();
            if(!res.ok) alert(data.error);
            loadMasterProducts();
        }

        async function editProduct(id, oldName, category, oldPrice) {
            const newName = prompt("Нова назва товару:", oldName);
            if (!newName) return;
            const newPrice = prompt("Нова ціна (грн):", oldPrice);
            if (!newPrice) return;

            if (Number(newPrice) <= 0) {
                return alert("Ціна має бути більшою за нуль!");
            }

            const res = await fetch(`/api/products/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName, category: category, price: newPrice, seller_id: user.id })
            });
            const data = await res.json();
            if(!res.ok) alert(data.error);
            loadMasterProducts();
        }

        // ЛОГІКА ПОКУПЦЯ
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const list = document.getElementById('cartItems');
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = '<p style="color: var(--sub); ">Кошик порожній.</p>';
                document.getElementById('totalPrice').innerText = `Разом: 0 грн`;
                return;
            }

            list.innerHTML = cart.map((i, index) => {
                total += Number(i.price);
                return `<div class="item">
                    <span>${i.name}</span>
                    <b>${i.price} грн <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff6b6b; cursor:pointer; margin-left:15px; font-weight:bold;">✕</button></b>
                </div>`;
            }).join('');
            document.getElementById('totalPrice').innerText = `Разом: ${total} грн`;
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if(cart.length === 0) return alert("Спочатку додайте товари у кошик!");
            
           window.location.href = '/checkout.html';
        }
    </script>
</body>
</html>
