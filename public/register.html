<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | MPP</title>
    <style>
        :root {
            --bg-color: #011F28;
            --form-bg: #324E59; 
            --input-bg: #E3DBD2;
            --text-dark: #011F28;
            --text-light: #E3DBD2;
            --sub-color: #7F888D;
            --accent: #000201;
            --error-color: #ff6b6b;
            
            --c-poly-1: rgba(50, 78, 89, 0.5);
            --c-poly-2: rgba(0, 2, 1, 0.6);
            --c-poly-3: rgba(127, 136, 141, 0.3);
            --c-poly-4: rgba(227, 219, 210, 0.15);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
        }

        .circles-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; 
        }

        .circle {
            position: absolute;
            border-radius: 50%;
        }

        .circle:nth-child(1)  { width: 300px; height: 300px; background: var(--c-poly-2); top: -100px; left: -80px; }
        .circle:nth-child(2)  { width: 120px; height: 120px; background: var(--c-poly-1); top: 150px; left: 10%; }
        .circle:nth-child(3)  { width: 60px;  height: 60px;  background: var(--c-poly-3); top: 40%;   left: 5%; }
        .circle:nth-child(4)  { width: 200px; height: 200px; background: var(--c-poly-2); bottom: -50px; left: -30px; }
        .circle:nth-child(5)  { width: 80px;  height: 80px;  background: var(--c-poly-4); bottom: 150px; left: 15%; }

        .circle:nth-child(6)  { width: 400px; height: 400px; background: var(--c-poly-1); top: 40%; left: 30%; transform: translate(-50%, -50%); opacity: 0.4; }
        .circle:nth-child(7)  { width: 150px; height: 150px; background: var(--c-poly-3); bottom: 10%; left: 45%; }

        .circle:nth-child(8)  { width: 250px; height: 250px; background: var(--c-poly-2); top: -50px; right: -60px; }
        .circle:nth-child(9)  { width: 100px; height: 100px; background: var(--c-poly-1); top: 180px; right: 12%; }
        .circle:nth-child(10) { width: 50px;  height: 50px;  background: var(--c-poly-4); top: 35%;   right: 8%; }
        .circle:nth-child(11) { width: 320px; height: 320px; background: var(--c-poly-2); bottom: -100px; right: -40px; }
        .circle:nth-child(12) { width: 130px; height: 130px; background: var(--c-poly-1); bottom: 180px; right: 15%; }

        .circle:nth-child(13) { width: 70px;  height: 70px;  background: var(--c-poly-3); top: 10%; left: 40%; }
        .circle:nth-child(14) { width: 90px;  height: 90px;  background: var(--c-poly-4); bottom: 30%; right: 40%; }
        .circle:nth-child(15) { width: 110px; height: 110px; background: var(--c-poly-2); top: 60%; right: 30%; opacity: 0.5;}

        .reg-container {
            background-color: var(--form-bg);
            backdrop-filter: blur(2px); 
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(227, 219, 210, 0.1);
            position: relative;
            z-index: 10; 
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-weight: 400;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75em;
            color: var(--sub-color);
            text-transform: uppercase;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-dark);
            font-size: 0.95em;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { border-color: var(--text-light); }
        input.invalid { border-color: var(--error-color); box-shadow: 0 0 8px rgba(255, 107, 107, 0.3); }

        #mainError {
            background-color: var(--accent);
            border-left: 4px solid var(--error-color);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
            line-height: 1.4;
        }

        .role-selection { display: flex; justify-content: center; gap: 25px; margin: 25px 0; }
        .radio-item { display: flex; align-items: center; cursor: pointer; font-size: 0.85em; }
        .radio-item input { display: none; }
        .custom-radio {
            width: 18px; height: 18px;
            border: 2px solid var(--sub-color);
            border-radius: 50%;
            margin-right: 10px;
            position: relative;
            background: var(--bg-color);
        }
        .radio-item input:checked + .custom-radio { border-color: var(--text-light); }
        .radio-item input:checked + .custom-radio::after {
            content: ''; width: 8px; height: 8px;
            background: var(--text-light); border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: var(--text-light);
            border: 1px solid var(--sub-color);
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--text-light);
            color: var(--accent);
            box-shadow: 0 5px 20px rgba(227, 219, 210, 0.2);
        }
    </style>
</head>
<body>

    <div class="circles-background">
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
    </div>

    <div class="reg-container">
        <h2>Реєстрація</h2>
        
        <div id="mainError"></div>

        <form id="regForm" novalidate>
            <div class="input-group">
                <label>Нікнейм</label>
                <input type="text" id="username" placeholder="логін для входу">
            </div>
            <div class="input-group">
                <label>Електронна пошта</label>
                <input type="email" id="email" placeholder="ваш@email.com">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="мінімум 6 символів">
            </div>
            <div class="input-group">
                <label>Підтвердження</label>
                <input type="password" id="confirmPassword" placeholder="повторіть пароль">
            </div>
            <div class="role-selection">
                <label class="radio-item">
                    <input type="radio" name="role" value="buyer" checked>
                    <span class="custom-radio"></span> Покупець
                </label>
                <label class="radio-item">
                    <input type="radio" name="role" value="seller">
                    <span class="custom-radio"></span> Майстер
                </label>
            
            </div>
            <button type="submit">Зареєструватися</button>
        </form>
        <p style="text-align:center; font-size: 0.85em; margin-top:20px; color: var(--sub-color);">
            Вже є акаунт? <a href="/login.html" style="color: var(--text-light); text-decoration: none; font-weight: bold;">Увійти</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const errorBox = document.getElementById('mainError');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            
            const inputs = {
                username: document.getElementById('username'),
                email: document.getElementById('email'),
                password: document.getElementById('password'),
                confirm: document.getElementById('confirmPassword')
            };

            Object.values(inputs).forEach(input => input.classList.remove('invalid'));

            let errors = [];

            let hasEmpty = false;
            Object.keys(inputs).forEach(key => {
                if (!inputs[key].value.trim()) {
                    inputs[key].classList.add('invalid');
                    hasEmpty = true;
                }
            });
            if (hasEmpty) errors.push("будь ласка, заповніть усі порожні поля");

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (inputs.email.value.trim() && !emailRegex.test(inputs.email.value)) {
                inputs.email.classList.add('invalid');
                errors.push("електронна пошта введена некоректно");
            }

            if (inputs.password.value.trim() && inputs.password.value.length < 6) {
                inputs.password.classList.add('invalid');
                errors.push("пароль має містити не менше 6 символів");
            }

            if (inputs.password.value && inputs.confirm.value && inputs.password.value !== inputs.confirm.value) {
                inputs.confirm.classList.add('invalid');
                errors.push("введені паролі не збігаються");
            }

            if (errors.length > 0) {
                showError(errors.join(". "));
                return;
            }

            const data = {
                username: inputs.username.value,
                email: inputs.email.value,
                password: inputs.password.value,
                role: document.querySelector('input[name="role"]:checked').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    window.location.href = '/'; 
                } else {
                    showError(result.error.toLowerCase());
                }
            } catch (err) {
                showError("не вдалося з’єднатися із сервером");
            }
        };

        function showError(text) {
            errorBox.innerText = text;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
