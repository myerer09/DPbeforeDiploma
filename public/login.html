<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | MPP</title>
    <style>
        :root {
            --bg-color: #011F28;
            --form-bg: #324E59; 
            --input-bg: #E3DBD2;
            --text-dark: #011F28;
            --text-light: #E3DBD2;
            --sub-color: #7F888D;
            --accent: #000000;
            --error-color: #ff6b6b;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- БАГАТО ШАРИКІВ: ГЕОМЕТРИЧНИЙ ФОН --- */
        .circles-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .circle { position: absolute; border-radius: 50%; }
        
        /* Великі фонові */
        .circle:nth-child(1) { width: 400px; height: 400px; background: rgba(0,2,1,0.6); top: -150px; left: -100px; }
        .circle:nth-child(2) { width: 300px; height: 300px; background: rgba(50,78,89,0.5); top: 10%; right: -50px; }
        .circle:nth-child(3) { width: 500px; height: 500px; background: rgba(0,2,1,0.5); bottom: -200px; left: 20%; }
        .circle:nth-child(4) { width: 250px; height: 250px; background: rgba(50,78,89,0.4); bottom: 10%; right: 10%; }

        /* Середні для нашарування */
        .circle:nth-child(5) { width: 150px; height: 150px; background: rgba(127,136,141,0.2); top: 20%; left: 15%; }
        .circle:nth-child(6) { width: 180px; height: 180px; background: rgba(0,2,1,0.4); top: 45%; right: 25%; }
        .circle:nth-child(7) { width: 130px; height: 130px; background: rgba(50,78,89,0.6); bottom: 30%; left: 5%; }
        .circle:nth-child(8) { width: 160px; height: 160px; background: rgba(127,136,141,0.2); top: 5%; left: 45%; }

        /* Маленькі акценти */
        .circle:nth-child(9) { width: 60px; height: 60px; background: rgba(227,219,210,0.1); top: 35%; left: 40%; }
        .circle:nth-child(10) { width: 40px; height: 40px; background: rgba(127,136,141,0.4); bottom: 15%; left: 45%; }
        .circle:nth-child(11) { width: 80px; height: 80px; background: rgba(0,2,1,0.3); top: 60%; right: 10%; }
        .circle:nth-child(12) { width: 50px; height: 50px; background: rgba(227,219,210,0.05); bottom: 45%; right: 40%; }
        .circle:nth-child(13) { width: 90px; height: 90px; background: rgba(50,78,89,0.5); top: 75%; left: 20%; }
        .circle:nth-child(14) { width: 70px; height: 70px; background: rgba(127,136,141,0.2); top: 15%; right: 35%; }
        .circle:nth-child(15) { width: 110px; height: 110px; background: rgba(0,2,1,0.4); bottom: 5%; right: 35%; }
        .circle:nth-child(16) { width: 30px; height: 30px; background: rgba(227,219,210,0.15); top: 55%; left: 10%; }
        .circle:nth-child(17) { width: 120px; height: 120px; background: rgba(50,78,89,0.3); top: 30%; right: 45%; }

        /* --- ФОРМА --- */
        .login-container {
            background-color: var(--form-bg);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 420px;
            z-index: 10;
            box-sizing: border-box; /* Важливо для рівних інпутів */
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 4px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 400;
        }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75em;
            color: var(--sub-color);
            text-transform: uppercase;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid transparent;
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-dark);
            font-size: 1em;
            box-sizing: border-box; 
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--text-light); }
        input.invalid { border-color: var(--error-color); }

        #loginError {
            background-color: var(--accent);
            border-left: 4px solid var(--error-color);
            color: var(--text-light);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
            line-height: 1.4;
        }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--accent);
            color: var(--text-light);
            border: 1px solid var(--sub-color);
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--text-light);
            color: var(--accent);
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85em;
            color: var(--sub-color);
        }

        .footer-link a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="circles-bg">
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
        <div class="circle"></div><div class="circle"></div>
    </div>

    <div class="login-container">
        <h2>Вхід</h2>
        
        <div id="loginError"></div>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label>Логін або Email</label>
                <input type="text" id="identifier" placeholder="логін або email">
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="введіть пароль">
            </div>

            <button type="submit">Увійти</button>
        </form>

        <div class="footer-link">
            немає акаунту? <a href="/register.html">Зареєструватися</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            
            const identifier = document.getElementById('identifier').value; 
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password }) 
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = '/';
                } else {
                    showError(result.error);
                }
            } catch (err) {
                showError("сервер недоступний");
            }
        };

        function showError(text) {
            errorBox.innerText = text;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
